name: Test & Build Docker Image

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8 (optional)
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-code of non-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Download spaCy model
      run: python -m spacy download en_core_web_sm
    
    - name: Test imports
      run: |
        python -c "from app.main import app; print('✓ FastAPI app imports successfully')"
        python -c "from app.services.parser import extract_resume_text; print('✓ Parser imports successfully')"
        python -c "from app.services.matcher import match_skills; print('✓ Matcher imports successfully')"
        python -c "from app.models.ai_engine import extract_skills_ai; print('✓ AI Engine imports successfully')"

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: myapp:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Docker build test
      run: docker build -t myapp:test .
    
    - name: Test Docker image runs
      run: |
        docker run --rm -d --name test-app -p 8000:8000 myapp:test
        sleep 5
        docker logs test-app
        if docker ps | grep test-app; then
          echo "✓ Container is running"
          docker stop test-app
        else
          echo "✗ Container failed to start"
          docker stop test-app || true
          exit 1
        fi
