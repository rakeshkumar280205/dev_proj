<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Analyzer</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            margin-top: 10px;
        }

        input[type="file"] {
            margin-top: 10px;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .progress-container {
            margin-top: 20px;
        }

        .progress-bar {
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #28a745;
            width: 0%;
            text-align: center;
            color: white;
            font-size: 12px;
        }

        .columns {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .card {
            flex: 1;
            background: #fafafa;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #ddd;
        }

        .card h3 {
            text-align: center;
            margin-bottom: 10px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
        }

        .resume-tag {
            background: #e3f2fd;
        }

        .jd-tag {
            background: #e8f5e9;
        }

        .gap-tag {
            background: #ffebee;
        }

        .loader {
            text-align: center;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1> AI Resume Skill Analyzer</h1>

    <label><b>Upload Resume</b></label>
    <input type="file" id="resume">

    <label><b>Job Description</b></label>
    <textarea id="jd"></textarea>

    <button onclick="analyze()">Analyze</button>

    <div class="loader" id="loader">Analyzing...</div>

    <!-- MATCH SCORE -->
    <div class="progress-container">
        <h3>Match Score</h3>
        <div class="progress-bar">
            <div id="progressFill" class="progress-fill">0%</div>
        </div>
    </div>

    <!-- 3 COLUMNS -->
    <div class="columns">
        <div class="card">
            <h3>Resume Skills</h3>
            <div id="resumeSkills" class="skills"></div>
        </div>

        <div class="card">
            <h3>Job Required Skills</h3>
            <div id="jdSkills" class="skills"></div>
        </div>

        <div class="card">
            <h3>Skill Gap</h3>
            <div id="gapSkills" class="skills"></div>
        </div>
    </div>
</div>

<script>
async function analyze() {
    const file = document.getElementById("resume").files[0];
    const jd = document.getElementById("jd").value;

    if (!file || !jd) {
        alert("Upload resume and enter JD");
        return;
    }

    const formData = new FormData();
    formData.append("resume", file);
    formData.append("job_description", jd);

    document.getElementById("loader").style.display = "block";

    const res = await fetch("/analyze", {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    document.getElementById("loader").style.display = "none";

    displaySkills("resumeSkills", data.resume_skills, "resume-tag");
    displaySkills("jdSkills", data.jd_skills, "jd-tag");
    displaySkills("gapSkills", data.skill_gap, "gap-tag");

    updateProgress(data.match_percentage);
}

function displaySkills(id, skills, className) {
    const container = document.getElementById(id);
    container.innerHTML = "";

    skills.forEach(skill => {
        const tag = document.createElement("div");
        tag.className = "tag " + className;
        tag.innerText = skill;
        container.appendChild(tag);
    });
}

function updateProgress(score) {
    const bar = document.getElementById("progressFill");

    score = Number(score) || 0;
    if (score > 70) {
    bar.style.background = "#28a745"; // green
    } else if (score > 40) {
    bar.style.background = "#ffc107"; // yellow
    } else {
    bar.style.background = "#dc3545"; // red
    bar.style.width = score + "%";
    bar.innerText = score.toFixed(1) + "%";
    }

}
</script>

</body>
</html>
